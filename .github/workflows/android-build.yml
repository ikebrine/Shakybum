name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # This produces an UNSIGNED debug APK, installable via sideload (Settings →
      # Install unknown apps) but not suitable for Play Store or a production
      # release. For a signed release APK, add a signing config using secrets
      # (RELEASE_KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) in
      # android/app/build.gradle, then run `./gradlew assembleRelease` instead —
      # see https://developer.android.com/studio/publish/app-signing
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shakybum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
