name: Build iOS App

# Runs on a macOS runner since Xcode only exists on macOS — this is the
# practical workaround for not owning a Mac. As configured, this builds for
# the iOS Simulator only (no signing needed, good for CI sanity-checks).
# To produce a real device / TestFlight build, you need an Apple Developer
# account and must add:
#   1. Your distribution certificate + provisioning profile as GitHub secrets
#   2. A signing step (see https://docs.fastlane.tools/codesigning/getting-started/)
#   3. Swap the `xcodebuild` destination below from "generic/platform=iOS Simulator"
#      to "generic/platform=iOS" and add -exportArchive with your export options plist

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned sanity build)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            build
